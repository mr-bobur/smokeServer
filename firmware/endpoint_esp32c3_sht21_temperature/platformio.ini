; ================================================================================
; PlatformIO Project Configuration: ESP32-C3 SHT21 Temperature & Humidity Endpoint
; Board: LilyGO T-ZigBee (ESP32-C3 MCU)
; Smart Building Wireless Sensor Ecosystem
; ================================================================================

[platformio]
default_envs = tzigbee_esp32c3_temp
description = SHT21 Temperature & Humidity Endpoint (LilyGO T-ZigBee ESP32-C3 BLE 5.0)

[env:tzigbee_esp32c3_temp]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
build_flags =
    -D CORE_DEBUG_LEVEL=3
