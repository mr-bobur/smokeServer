; ================================================================================
; PlatformIO Project: Optical Smoke Detector Firmware (Seeed Studio XIAO ESP32-C3)
; Photoelectric IR Chamber (IR LED + Photodiode Receiver) + Piezo Buzzer + BLE 5.0
; Enterprise Smart Building Wireless Smoke & Security Ecosystem
; ================================================================================

[platformio]
default_envs = seeed_xiao_esp32c3
description = Optical Smoke Sensor on Seeed XIAO ESP32-C3 (Salvaged Chamber + BLE Beacon)

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 160000000L
board_build.flash_mode = qio

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
