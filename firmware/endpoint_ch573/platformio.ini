[platformio]
default_envs = genericCH573F

[env:genericCH573F]
platform = ch32v
board = genericCH573F
framework = noneos-sdk
monitor_speed = 115200
build_flags =
    -I src/hal
    -I src/hal/include
    -I src/ble
    -L src/ble
    -lCH57xBLE

; Upload via WCH-Link / WCH-LinkE debugger (connected to PB14 TIO, PB15 TCK)
[env:wchlink]
platform = ch32v
board = genericCH573F
framework = noneos-sdk
monitor_speed = 115200
upload_protocol = wch-link
build_flags =
    -I src/hal
    -I src/hal/include
    -I src/ble
    -L src/ble
    -lCH57xBLE

; Upload via USB Type-C using built-in ISP bootloader (Hold BOOT/PB22 button while plugging in)
[env:usb_isp]
platform = ch32v
board = genericCH573F
framework = noneos-sdk
monitor_speed = 115200
upload_protocol = custom
upload_command = C:\Users\USER\.platformio\packages\tool-wchisp\wchisp.exe flash $SOURCE
build_flags =
    -I src/hal
    -I src/hal/include
    -I src/ble
    -L src/ble
    -lCH57xBLE
