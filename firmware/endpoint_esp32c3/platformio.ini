; ================================================================================
; PlatformIO Project Configuration: Modular Sensor Endpoint (ESP32-C3 BLE 5.0)
; Enterprise Smart Building Wireless Smoke & Security Ecosystem
; ================================================================================

[platformio]
default_envs = esp32c3_micro
description = Battery-Powered Smoke & Security Sensor Endpoint (ESP32-C3 BLE 5.0 Beacon / Deep-Sleep)

; --------------------------------------------------------------------------------
; 1. Environment: Seeed Studio XIAO ESP32-C3
; Pin Mapping:
;   D1 (GPIO 3) -> Smoke Sensor AO (ADC1_CH3)
;   D2 (GPIO 4) -> Chamber IR Emitter LED
;   D3 (GPIO 5) -> Buzzer Siren (Anti-Chirp Pulldown)
;   D4 (GPIO 6) -> External Status LED
;   D9 (GPIO 9) -> BOOT Button
; --------------------------------------------------------------------------------
[env:esp32c3_xiao]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
build_flags =
    -D BOARD_SEEED_XIAO
    -D CORE_DEBUG_LEVEL=3

; --------------------------------------------------------------------------------
; 2. Environment: ESP32-C3 SuperMini / Micro
; Direct Silkscreen Pin Mapping:
;   Pin 1 (GPIO 1 / ADC1_CH1) -> Smoke Sensor AO (ADC)
;   Pin 2 (GPIO 2)            -> Chamber IR Emitter LED
;   Pin 3 (GPIO 3)            -> Buzzer Siren (Anti-Chirp Pulldown)
;   Pin 4 (GPIO 4)            -> External Status LED
;   Pin 8 (GPIO 8)            -> Onboard Blue Status LED (Active-LOW)
;   Pin 9 (GPIO 9)            -> BOOT Button
; --------------------------------------------------------------------------------
[env:esp32c3_micro]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
build_flags =
    -D BOARD_ESP32C3_MICRO
    -D CORE_DEBUG_LEVEL=3

; Backward compatibility alias
[env:esp32c3_endpoint]
extends = env:esp32c3_xiao
