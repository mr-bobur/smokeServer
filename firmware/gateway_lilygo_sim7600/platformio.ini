; ================================================================================
; PlatformIO Project Configuration: Central Gateway (LilyGO T-SIM7600 4G LTE + BLE)
; Enterprise Smart Building Wireless Smoke & Security Ecosystem
; ================================================================================

[platformio]
default_envs = lilygo_t_sim7600
description = Central Gateway on LilyGO T-SIM7600 (TinyGSM + MQTT + BLE Scanner)

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    vshymanskyy/TinyGSM @ ^0.12.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0

; --------------------------------------------------------------------------------
; Environment 1: LilyGO T-SIM7600 / T-SIM7670 S3 (ESP32-S3 with Native USB CDC)
; Matching connected board on COM21 (ESP32-S3 QFN56 with 8MB PSRAM)
; --------------------------------------------------------------------------------
[env:lilygo_t_sim7600_s3]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = default_8MB.csv
build_flags =
    -D BOARD_LILYGO_S3=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D TINY_GSM_MODEM_SIM7600
    -D TINY_GSM_RX_BUFFER=1024
    -D CORE_DEBUG_LEVEL=3

; --------------------------------------------------------------------------------
; Environment 2: LilyGO T-SIM7600X (Classic ESP32-WROVER-B)
; --------------------------------------------------------------------------------
[env:lilygo_t_sim7600]
board = esp-wrover-kit
board_build.mcu = esp32
board_build.partitions = huge_app.csv
upload_port = COM22
monitor_port = COM22
build_flags =
    -D BOARD_LILYGO_ESP32=1
    -D TINY_GSM_MODEM_SIM7600
    -D TINY_GSM_RX_BUFFER=1024
    -D CORE_DEBUG_LEVEL=3
