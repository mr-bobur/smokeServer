; ================================================================================
; PlatformIO Project: Central Gateway (LilyGO T-Call ESP32 + SIM800L 2G GPRS)
; Enterprise Smart Building Wireless Smoke & Security Ecosystem
; ================================================================================

[platformio]
default_envs = lilygo_t_call_sim800
description = Central Gateway on LilyGO T-Call (SIM800L + TinyGSM + MQTT + BLE Scanner)

[env:lilygo_t_call_sim800]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32
board_build.partitions = huge_app.csv

lib_deps =
    vshymanskyy/TinyGSM @ ^0.12.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -D BOARD_LILYGO_TCALL_SIM800=1
    -D TINY_GSM_MODEM_SIM800
    -D TINY_GSM_RX_BUFFER=1024
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
