; ================================================================================
; PlatformIO Project: Floor Sub-Hub (ESP32-C3 + RS485 Half-Duplex Slave)
; Enterprise Smart Building Wireless Smoke & Security Ecosystem (Floors 1 - 20)
; ================================================================================

[platformio]
default_envs = esp32c3_floor_hub
description = Floor Sub-Hub (ESP32-C3 + MAX485 + JSON CRC-16 Protocol)

[env:esp32c3_floor_hub]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -D CORE_DEBUG_LEVEL=3
